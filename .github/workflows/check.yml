name: Verificar NexCell

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar JavaScript
        run: npm run check
      - name: Validar rotas estáticas
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nexcell-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 3 --retry-connrefused --retry-delay 0 --fail http://127.0.0.1:4173/
          curl --fail http://127.0.0.1:4173/store/
          curl --fail 'http://127.0.0.1:4173/produto/?id=teste'
          curl --fail http://127.0.0.1:4173/pdv/ | grep -q 'app-v2.js'
          curl --fail http://127.0.0.1:4173/pdv/sw.js | grep -q 'nexcell-pdv-shell'
          curl --fail http://127.0.0.1:4173/pdv/modules/offline-store.js | grep -q 'expected_register_id'
          curl --fail http://127.0.0.1:4173/pdv/modules/terminal-lock.js | grep -q 'nexcell-pdv-terminal'
          curl --fail http://127.0.0.1:4173/control/
