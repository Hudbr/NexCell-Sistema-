name: Publicar NexCell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Identificar versão publicada do PDV
        run: |
          printf "export const BUILD_VERSION='%s'\n" "$GITHUB_SHA" > pdv/build-version.js
          printf '{"version":"%s"}\n' "$GITHUB_SHA" > pdv/version.json
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
