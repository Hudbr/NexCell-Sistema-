name: Publicar NexCell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Versionar arquivos e ativar atualização automática
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os

          sha = os.environ['GITHUB_SHA']
          short = sha[:12]
          index = Path('pdv/index.html')
          html = index.read_text(encoding='utf-8')

          html = html.replace('../assets/css/base.css"', f'../assets/css/base.css?v={short}"')
          html = html.replace('../assets/css/workspace.css"', f'../assets/css/workspace.css?v={short}"')
          html = html.replace('./app.js"></script>', f'./app.js?v={short}"></script>')

          watcher = f'''\n    <script>
      (() => {{
        const currentBuild = {json.dumps(sha)};
        let checking = false;

        async function checkBuild() {{
          if (checking) return;
          checking = true;
          try {{
            const response = await fetch('./version.json?t=' + Date.now(), {{ cache: 'no-store' }});
            if (!response.ok) return;
            const data = await response.json();
            const nextBuild = String(data.version || '');
            if (nextBuild && nextBuild !== currentBuild) {{
              const url = new URL(location.href);
              url.searchParams.set('__build', nextBuild.slice(0, 12));
              location.replace(url.toString());
            }}
          }} catch (_) {{}}
          finally {{ checking = false; }}
        }}

        setInterval(checkBuild, 20000);
        addEventListener('focus', checkBuild);
        document.addEventListener('visibilitychange', () => {{
          if (!document.hidden) checkBuild();
        }});
      }})();
    </script>\n'''
          html = html.replace('</body>', watcher + '  </body>')
          index.write_text(html, encoding='utf-8')
          Path('pdv/version.json').write_text(
            json.dumps({'version': sha, 'generated_at': os.environ.get('GITHUB_RUN_ID', '')}),
            encoding='utf-8'
          )
          PY

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
