<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Produto • NexCell Store</title>
    <script>
      const current = new URL(window.location.href);
      const id = current.searchParams.get('id');
      const path = id ? `/produto/${encodeURIComponent(id)}` : '/';
      const target = new URL(path, 'https://nexcellstore.vercel.app');
      target.hash = current.hash;
      window.location.replace(target.href);
    </script>
  </head>
  <body>
    <p>Abrindo a página de produto atual da NexCell Store…</p>
  </body>
</html>
