<!-- FIREBASE SDK MODULAR COM FORCE LONG POLLING -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            initializeFirestore, 
            collection, 
            onSnapshot, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            increment, 
            getDocs 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQ9Jw5tCaff3t4wgeAkfFr051s07wdlhg",
            authDomain: "nexcell-6515.firebaseapp.com",
            projectId: "nexcell-6515",
            storageBucket: "nexcell-6515.firebasestorage.app",
            messagingSenderId: "374302980620",
            appId: "1:374302980620:web:e6fae5ca987fce851d4c29",
            measurementId: "G-3WGPE1NXX6"
        };

        const app = initializeApp(firebaseConfig);
        
        // Ativa o modo de compatibilidade direta via HTTP
        const db = initializeFirestore(app, {
            experimentalForceLongPolling: true
        });

        let catalogo = [];
        let carrinho = [];
        let marcaFiltro = 'TODOS';

        setInterval(() => { 
            document.getElementById('liveClock').innerText = new Date().toLocaleTimeString('pt-BR'); 
        }, 1000);

        // OUVE ALTERAÇÕES NO BANCO EM TEMPO REAL
        onSnapshot(collection(db, "produtos"), (snapshot) => {
            catalogo = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            renderizarCatalogo(catalogo);
            renderizarTabelaEstoque(catalogo);
        }, (error) => {
            console.error("Erro no Firestore:", error);
        });

        function renderizarCatalogo(itens) {
            const grid = document.getElementById('gridProdutos');
            grid.innerHTML = '';
            let filtrados = marcaFiltro === 'TODOS' ? itens : itens.filter(p => (p.marca || '').toLowerCase() === marcaFiltro.toLowerCase());

            filtrados.forEach(p => {
                const isLow = (p.estoque || 0) <= 3;
                const card = document.createElement('div');
                card.className = 'prod-card';
                card.onclick = () => addCarrinho(p.id);
                card.innerHTML = `
                    <div>
                        <div style="display:flex; justify-content:space-between;">
                            <span class="badge-brand">${p.marca || ''}</span>
                            <span style="font-size:9px; color:var(--text-muted); font-weight:700;">${p.categoria || ''}</span>
                        </div>
                        <div class="prod-title">${p.nome || ''}</div>
                        <div class="prod-model">${p.modelo || ''}</div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:4px;">
                        <span class="prod-price">R$ ${parseFloat(p.preco || 0).toFixed(2).replace('.', ',')}</span>
                        <span class="prod-stock-tag ${isLow ? 'low' : ''}">${p.estoque || 0} un</span>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function renderizarTabelaEstoque(itens) {
            const tbody = document.getElementById('tabelaCorpoProdutos');
            tbody.innerHTML = '';
            itens.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><b>${p.nome}</b><br><span style="font-size:10.5px; color:var(--text-muted);">${p.modelo || ''}</span></td>
                    <td>${p.marca || ''}</td>
                    <td><b>R$ ${parseFloat(p.preco || 0).toFixed(2).replace('.', ',')}</b></td>
                    <td><b style="color:${(p.estoque || 0) <= 3 ? 'var(--danger)' : 'var(--text-dark)'};">${p.estoque || 0} un</b></td>
                    <td>
                        <button class="btn-sm btn-repor" style="color:var(--brand-orange);">+ Repor</button>
                        <button class="btn-sm btn-edit">✏️</button>
                        <button class="btn-sm btn-del" style="color:var(--danger);">🗑️</button>
                    </td>`;
                
                tr.querySelector('.btn-repor').onclick = () => abrirModalRepor(p.id);
                tr.querySelector('.btn-edit').onclick = () => abrirModalEdicao(p.id);
                tr.querySelector('.btn-del').onclick = () => excluirProduto(p.id);
                tbody.appendChild(tr);
            });
        }

        function abrirModalRepor(id) {
            const p = catalogo.find(i => i.id === id);
            document.getElementById('reporProdId').value = p.id;
            document.getElementById('reporNomeProd').innerText = `${p.nome} (${p.modelo || ''})`;
            document.getElementById('modalReporEstoque').style.display = 'flex';
        }

        document.getElementById('btnConfirmarRepor').onclick = async () => {
            const id = document.getElementById('reporProdId').value;
            const qtd = parseInt(document.getElementById('reporQtdInput').value);
            try {
                await updateDoc(doc(db, "produtos", id), {
                    estoque: increment(qtd)
                });
                document.getElementById('modalReporEstoque').style.display = 'none';
            } catch (err) {
                alert("Erro ao repor estoque: " + err.message);
            }
        };

        document.getElementById('btnAbrirNovoProd').onclick = () => {
            document.getElementById('modalProdTitulo').innerText = "📦 Novo Produto";
            document.getElementById('editProdId').value = "";
            document.getElementById('editCodigo').value = "";
            document.getElementById('editCategoria').value = "";
            document.getElementById('editNome').value = "";
            document.getElementById('editMarca').value = "";
            document.getElementById('editModelo').value = "";
            document.getElementById('editPreco').value = "";
            document.getElementById('editEstoque').value = "10";
            document.getElementById('modalEditarProduto').style.display = 'flex';
        };

        function abrirModalEdicao(id) {
            const p = catalogo.find(item => item.id === id);
            document.getElementById('modalProdTitulo').innerText = "✏️ Editar Produto";
            document.getElementById('editProdId').value = p.id;
            document.getElementById('editCodigo').value = p.codigo || '';
            document.getElementById('editCategoria').value = p.categoria || '';
            document.getElementById('editNome').value = p.nome || '';
            document.getElementById('editMarca').value = p.marca || '';
            document.getElementById('editModelo').value = p.modelo || '';
            document.getElementById('editPreco').value = p.preco || 0;
            document.getElementById('editEstoque').value = p.estoque || 0;
            document.getElementById('modalEditarProduto').style.display = 'flex';
        }

        document.getElementById('btnSalvarProd').onclick = async () => {
            const btn = document.getElementById('btnSalvarProd');
            btn.disabled = true;
            btn.innerText = "Salvando...";

            const id = document.getElementById('editProdId').value;
            const payload = {
                codigo: document.getElementById('editCodigo').value || '',
                categoria: document.getElementById('editCategoria').value || 'Geral',
                nome: document.getElementById('editNome').value || 'Sem Nome',
                marca: document.getElementById('editMarca').value || 'Outros',
                modelo: document.getElementById('editModelo').value || 'Geral',
                preco: parseFloat(document.getElementById('editPreco').value || 0),
                estoque: parseInt(document.getElementById('editEstoque').value || 0)
            };

            try {
                if (id) {
                    await updateDoc(doc(db, "produtos", id), payload);
                } else {
                    await addDoc(collection(db, "produtos"), payload);
                }
                document.getElementById('modalEditarProduto').style.display = 'none';
            } catch (err) {
                console.error("Erro ao salvar produto:", err);
                alert("Erro ao gravar no Firebase: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Salvar no Firestore";
            }
        };

        async function excluirProduto(id) {
            if (!confirm('Excluir este produto do Firestore?')) return;
            try {
                await deleteDoc(doc(db, "produtos", id));
            } catch (err) {
                alert("Erro ao excluir: " + err.message);
            }
        }

        function addCarrinho(id) {
            const prod = catalogo.find(p => p.id === id);
            if ((prod.estoque || 0) <= 0) return alert('Sem estoque disponível!');
            const idx = carrinho.findIndex(i => i.id === id);
            if (idx >= 0) {
                if (carrinho[idx].qtd + 1 > prod.estoque) return alert('Limite de estoque atingido!');
                carrinho[idx].qtd += 1;
            } else {
                carrinho.push({ ...prod, qtd: 1 });
            }
            atualizarCarrinho();
        }

        function alterarQtd(idx, delta) {
            const item = carrinho[idx];
            const prod = catalogo.find(p => p.id === item.id);
            if (item.qtd + delta > prod.estoque) return alert('Estoque insuficiente!');
            item.qtd += delta;
            if (item.qtd <= 0) carrinho.splice(idx, 1);
            atualizarCarrinho();
        }

        function atualizarCarrinho() {
            let total = 0;
            let totalItens = 0;
            const htmlConteudo = carrinho.map((item, idx) => {
                const subtotal = parseFloat(item.preco) * item.qtd;
                total += subtotal;
                totalItens += item.qtd;
                return `
                    <div class="cart-row">
                        <div style="flex:1;">
                            <span style="font-size:12px; font-weight:700;">${item.nome}</span>
                            <span style="font-size:10px; color:var(--text-muted); display:block;">${item.modelo || ''}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:4px; margin:0 6px;">
                            <button class="qty-btn" onclick="window._alterarQtd(${idx}, -1)">-</button>
                            <span style="font-size:12px; font-weight:800; min-width:16px; text-align:center;">${item.qtd}</span>
                            <button class="qty-btn" onclick="window._alterarQtd(${idx}, 1)">+</button>
                        </div>
                        <span style="font-weight:800; font-size:12px;">R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                    </div>`;
            }).join('');

            const placeholder = `<div style="text-align:center; color:var(--text-muted); font-size:12px; margin:auto 0; padding:20px;">Carrinho vazio</div>`;
            
            document.getElementById('listaCarrinhoDesktop').innerHTML = htmlConteudo || placeholder;
            document.getElementById('visorTotalDesktop').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('listaCarrinhoMobile').innerHTML = htmlConteudo || placeholder;
            document.getElementById('visorTotalMobile').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            document.getElementById('badgeCartQtd').innerText = totalItens;
            document.getElementById('badgeCartTotal').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        window._alterarQtd = alterarQtd;

        async function finalizarVenda() {
            if (carrinho.length === 0) return alert('Carrinho vazio!');
            const total = carrinho.reduce((acc, cur) => acc + (parseFloat(cur.preco) * cur.qtd), 0);
            const isMobile = window.innerWidth <= 850;
            const metodo = isMobile ? document.getElementById('cxMetodoMobile').value : document.getElementById('cxMetodoDesktop').value;

            try {
                for (const item of carrinho) {
                    await updateDoc(doc(db, "produtos", item.id), {
                        estoque: increment(-item.qtd)
                    });
                }

                await addDoc(collection(db, "vendas"), {
                    valor_total: total,
                    forma_pagamento: metodo,
                    data_venda: new Date().toISOString()
                });

                alert(`✔️ Venda confirmada de ${total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}!`);
                carrinho = [];
                atualizarCarrinho();
                document.getElementById('modalCarrinhoMobile').classList.remove('active');
            } catch (err) {
                alert("Erro ao registrar venda: " + err.message);
            }
        }

        document.getElementById('btnConcluirDesktop').onclick = finalizarVenda;
        document.getElementById('btnConcluirMobile').onclick = finalizarVenda;
        document.getElementById('btnLimparCartDesktop').onclick = () => { carrinho = []; atualizarCarrinho(); };

        document.getElementById('btnCartFloating').onclick = () => {
            document.getElementById('modalCarrinhoMobile').classList.add('active');
        };
        document.getElementById('btnFecharCartMobile').onclick = () => {
            document.getElementById('modalCarrinhoMobile').classList.remove('active');
        };

        document.getElementById('barcodeReader').oninput = (e) => {
            const b = e.target.value.toLowerCase();
            const filtrados = catalogo.filter(p => 
                (p.nome || '').toLowerCase().includes(b) || 
                (p.modelo || '').toLowerCase().includes(b) || 
                (p.marca || '').toLowerCase().includes(b) || 
                (p.codigo || '').includes(b)
            );
            renderizarCatalogo(filtrados);
        };

        async function carregarFechamento() {
            try {
                const snapshot = await getDocs(collection(db, "vendas"));
                const stream = document.getElementById('balancoStream');
                stream.innerHTML = '';
                let totalGeral = 0;
                const balanco = {};

                snapshot.docs.forEach(docSnap => {
                    const v = docSnap.data();
                    balanco[v.forma_pagamento] = (balanco[v.forma_pagamento] || 0) + parseFloat(v.valor_total || 0);
                    totalGeral += parseFloat(v.valor_total || 0);
                });

                for (const [metodo, valor] of Object.entries(balanco)) {
                    stream.innerHTML += `
                        <div style="display:flex; justify-content:space-between; padding:8px; border-bottom:1px solid var(--border);">
                            <span><b>${metodo}</b></span>
                            <b>R$ ${parseFloat(valor).toFixed(2).replace('.', ',')}</b>
                        </div>`;
                }

                stream.innerHTML += `
                    <div style="display:flex; justify-content:space-between; padding:12px 8px; font-weight:800; font-size:15px;">
                        <span>TOTAL DIA:</span>
                        <span style="color:var(--brand-orange);">R$ ${totalGeral.toFixed(2).replace('.', ',')}</span>
                    </div>`;
            } catch (err) {
                alert("Erro ao buscar fechamento: " + err.message);
            }
        }

        document.getElementById('btnAtualizarFechamento').onclick = carregarFechamento;

        document.querySelectorAll('#ribbonContainer .ribbon-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('#ribbonContainer .ribbon-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                marcaFiltro = btn.dataset.marca;
                renderizarCatalogo(catalogo);
            };
        });

        function mudarAba(aba) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            if (aba === 'vender') document.getElementById('viewVender').classList.add('active');
            if (aba === 'produtos') document.getElementById('viewProdutos').classList.add('active');
            if (aba === 'fechamento') {
                document.getElementById('viewFechamento').classList.add('active');
                carregarFechamento();
            }
        }

        document.getElementById('btnNavVender').onclick = (e) => { ativarNav(e.target); mudarAba('vender'); };
        document.getElementById('btnNavProdutos').onclick = (e) => { ativarNav(e.target); mudarAba('produtos'); };
        document.getElementById('btnNavFechamento').onclick = (e) => { ativarNav(e.target); mudarAba('fechamento'); };

        document.getElementById('mNavVender').onclick = (e) => { ativarNavMobile(e.currentTarget); mudarAba('vender'); };
        document.getElementById('mNavProdutos').onclick = (e) => { ativarNavMobile(e.currentTarget); mudarAba('produtos'); };
        document.getElementById('mNavFechamento').onclick = (e) => { ativarNavMobile(e.currentTarget); mudarAba('fechamento'); };

        function ativarNav(el) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }
        function ativarNavMobile(el) {
            document.querySelectorAll('.m-nav-item').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
